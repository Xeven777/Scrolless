name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/gradle-ci.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLEENCRYPTIONKEY }}

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret $name is not set, cannot sign the release"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          # printf, not a heredoc: a password containing $, `, \ or ! would be
          # mangled by heredoc expansion and signing would silently break.
          {
            printf 'storeFile=keystore/release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Bump the version
        id: bump
        run: |
          set -euo pipefail
          file=app/build.gradle.kts
          old_name=$(sed -nE 's/^[[:space:]]*versionName = "(.+)"$/\1/p' "$file")
          old_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' "$file")
          new_code=$((old_code + 1))
          # Bump the trailing number of the version name: 1.7.0 -> 1.7.1.
          prefix=$(printf '%s' "$old_name" | sed -E 's/^(.*[^0-9])[0-9]+$/\1/')
          last=$(printf '%s' "$old_name" | sed -E 's/.*[^0-9]([0-9]+)$/\1/')
          new_name="$prefix$((last + 1))"
          sed -i -E "s/^([[:space:]]*)versionName = \".*\"$/\1versionName = \"$new_name\"/" "$file"
          sed -i -E "s/^([[:space:]]*)versionCode = [0-9]+$/\1versionCode = $new_code/" "$file"
          echo "name=$new_name" >> "$GITHUB_OUTPUT"
          echo "code=$new_code" >> "$GITHUB_OUTPUT"
          echo "Bumping $old_name ($old_code) -> $new_name ($new_code)"

      - name: Assemble the release APK
        run: ./gradlew :app:assembleRelease

      - name: Commit the version bump
        # The release is already live, so a conflict here (someone pushed meanwhile) warns, it does not fail.
        if: startsWith(github.ref, 'refs/heads/')
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git diff --cached --quiet && exit 0
          git commit -m "Release ${{ steps.bump.outputs.name }} (versionCode ${{ steps.bump.outputs.code }})"
          git push origin "HEAD:$GITHUB_REF"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version='${{ steps.bump.outputs.name }}'
          tag="v$version"
          mv app/build/outputs/apk/release/app-release.apk "Scrolless-$version.apk"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, replacing the APK on it"
            gh release upload "$tag" "Scrolless-$version.apk" --clobber
          else
            gh release create "$tag" "Scrolless-$version.apk" \
              --title "Scrolless $version" --generate-notes
          fi
          gh release view "$tag" --json url --jq .url