name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/gradle-ci.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLEENCRYPTIONKEY }}

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret $name is not set, cannot sign the release"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          # printf, not a heredoc: a password containing $, `, \ or ! would be
          # mangled by heredoc expansion and signing would silently break.
          {
            printf 'storeFile=keystore/release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Assemble the release APK
        run: ./gradlew :app:assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^[[:space:]]*versionName = "(.+)"$/\1/p' app/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          tag="v$version"
          mv app/build/outputs/apk/release/app-release.apk "Scrolless-$version.apk"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, replacing the APK on it"
            gh release upload "$tag" "Scrolless-$version.apk" --clobber
          else
            gh release create "$tag" "Scrolless-$version.apk" \
              --title "Scrolless $version" --generate-notes
          fi
          gh release view "$tag" --json url --jq .url